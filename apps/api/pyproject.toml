[project]
name = "radar-api"
version = "0.1.0"
description = "Finance Opinion Radar API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# autogen 迁移为机器生成，行长不适用
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# "x.*" 不匹配顶层模块本身，需同时列出（celery 装有包但无 py.typed，报 import-untyped）
module = [
  "celery",
  "celery.*",
  "redis",
  "redis.*",
  "pydantic_settings",
  "boto3",
  "boto3.*",
  "botocore",
  "botocore.*",
]
ignore_missing_imports = true
