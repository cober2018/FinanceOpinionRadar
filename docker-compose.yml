# RAD-002 本地开发依赖: postgres / redis / minio + 一次性 bucket 初始化 (minio-init)。
# 可选覆盖变量 (均为可选项, 未设置时直接使用下列默认值, 与 .env.example 中
# DATABASE_URL / REDIS_URL / S3_* 假设的端口与凭据一致):
#   POSTGRES_PORT=5432  REDIS_PORT=6379  MINIO_API_PORT=9000  MINIO_CONSOLE_PORT=9001
#   MINIO_ROOT_USER=radar  MINIO_ROOT_PASSWORD=radar-secret
# MinIO 镜像按 D6/D51 固定 RELEASE tag (禁止 :latest); mc 从 quay.io 拉取, 因本机
# registry mirror 对 docker.io/minio/mc 仓库返回 403, quay.io 为 MinIO 官方发布源。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-radar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-radar-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-radar} ${MINIO_ROOT_PASSWORD:-radar-secret} &&
      mc mb --ignore-existing local/radar-media &&
      echo 'bucket radar-media ready'"

volumes:
  pgdata:
  miniodata:
