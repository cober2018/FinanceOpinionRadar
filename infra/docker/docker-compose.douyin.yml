# 统一产品架构：三个能力引擎全部由本仓库源码构建（engines/{media,recording,danmaku}，
# 来源与版本见各 SOURCE.md）。原外部 pin 镜像仅作为回退产物保留在引擎 SOURCE.md 记录。
# 与仓库根 docker-compose.yml（radar 自身 dev 依赖）相互独立、可并存。
# 部署/引导序列与每步预期输出见 README「抖音 Quickstart」；镜像升级见「升级外部镜像」。
#
# 镜像 pin 策略（沿 D6/D51，禁 :latest）：两个外部镜像 pin 明确 tag；
# timescaledb 以 spike 实测 digest pin（latest 漂移可能破坏 hypertable 迁移假设）。
# 网络注意（OrbStack + registry mirror）：本机 mirror 对个别 docker.io 仓库返回 403
# （radar 主 compose 的 mc 因此改走 quay.io）；本文件涉及镜像在 spike 实拉均直连成功，
# 遇 pull 403/404 先查 Docker 设置中的 registry mirrors。
#
# 共享状态（host bind，宿主 venv 跑 make worker-beat 的 radar 进程直接读写）：
#   ${DOUYIN_STATE_DIR}/streamcap-config  StreamCap 配置目录
#     —— radar 值守桥原子写 recordings.json（.env: RECORDER_CONFIG_PATH）
#   ${DOUYIN_STATE_DIR}/live_segments     分片落盘目录
#     —— StreamCap 写 / radar live ingest 读（.env: LIVE_SEGMENTS_DIR）
#
# 必需变量：
#   DTK_SECRET_KEY   dtk 凭据主密钥（≥32 字符；必须跨重启持久，换钥则已存身份不可解）
#     生成：export DTK_SECRET_KEY="$(openssl rand -base64 48)"
# 可选变量：DOUYIN_API_PORT(8080)  STREAMCAP_UI_PORT(5001)
#   DOUYIN_STATE_DIR(../../data/douyin，相对本文件)
#   DOUYIN_COOKIES_FILE(/dev/null；真实 jar 见 README cookie 步骤)

name: radar-douyin

services:
  dtk-postgres:
    image: timescale/timescaledb:latest-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
    container_name: dtk-postgres
    # 日志上限（2026-10-12）：json-file 默认无限增长（streamcap/douyinlive 高频打日志）
    logging: &log_opts
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    environment:
      POSTGRES_USER: dtk
      POSTGRES_PASSWORD: dtk
      POSTGRES_DB: dtk
    volumes: ["dtk_pgdata:/var/lib/postgresql/data"]
    mem_limit: 1g  # 实测 ~320MB
    networks: [dtk-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtk -d dtk"]
      interval: 5s
      timeout: 3s
      retries: 12

  dtk-redis:
    image: redis:7-alpine
    container_name: dtk-redis
    logging: *log_opts
    mem_limit: 256m  # 实测 ~11MB
    networks: [dtk-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # dtk 迁移强制 hypertable（TimescaleDB）；一次性容器，api/worker 等它成功后再起
  dtk-migrate:
    build: { context: ../../engines/media, dockerfile: Dockerfile }
    image: radar-engine-media
    container_name: dtk-migrate
    logging: *log_opts
    entrypoint: []
    command: ["python", "-m", "dtk.cli.main", "migrate"]
    environment: &dtk_env
      DTK_SECRET_KEY: ${DTK_SECRET_KEY:?未设置——openssl rand -base64 48 生成后 export，见文件头注释}
      DTK_DATABASE_URL: postgresql+asyncpg://dtk:dtk@dtk-postgres:5432/dtk
      DTK_REDIS_URL: redis://dtk-redis:6379/0
    depends_on:
      dtk-postgres: { condition: service_healthy }
      dtk-redis: { condition: service_healthy }
    networks: [dtk-net]
    restart: "no"

  douyin-api:
    build: { context: ../../engines/media, dockerfile: Dockerfile }
    image: radar-engine-media
    container_name: douyin-api
    logging: *log_opts
    entrypoint: []
    command: ["uvicorn", "engines.media.server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *dtk_env
    ports: ["127.0.0.1:${DOUYIN_API_PORT:-8080}:8000"]
    volumes:
      # cookie jar 只读挂载仅为容器内取用方便；radar 的 import 走 API（curl 在宿主侧读文件）
      - "${DOUYIN_COOKIES_FILE:-/dev/null}:/cookies/douyin.cookies.txt:ro"
    mem_limit: 768m  # 实测 ~120MB
    depends_on:
      dtk-migrate: { condition: service_completed_successfully }
    networks: [dtk-net]
    restart: unless-stopped
    healthcheck:
      # /docs 属原镜像 console 静态页，产品引擎镜像不带 console（404）；引擎文档端点为
      # /swagger（lean 同步引擎同路径，验收 A1 后仍是唯一探活端点）。
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/swagger', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 验收 A1（2026-11-03）：dtk-worker 服务移除。媒体引擎改为精简同步执行
  # （engines/media/server.py：registry.resolve → FetchService.fetch 请求内完成），
  # 不再有 Task 表 / tasks:queue / worker 进程；业务调度始终在雷达（Celery）。

  # 统一架构：产品无头录制引擎（engines/recording），监控循环随进程自启，
  # 不再需要浏览器 UI 会话激活（scripts/streamcap_keepalive.sh 由此退役）。
  streamcap:
    build: { context: ../../engines/recording, dockerfile: Dockerfile }
    image: radar-engine-recording
    container_name: streamcap
    logging: *log_opts
    environment:
      # 分片目录日期键用容器本地时间；radar ingest 会话键按日期目录归并，须与观测时区一致
      TZ: Asia/Shanghai
      STREAMCAP_CONFIG_DIR: /data/config
    mem_limit: 1g  # 实测 ~65MB；录制时 ffmpeg 峰值数倍，留足
    volumes:
      - "${DOUYIN_STATE_DIR:-../../data/douyin}/streamcap-config:/data/config"
      # 分片必须挂 /app/downloads：StreamCap 写盘路径由 user_settings.live_save_path 决定，
      # 存量配置与 recorder_bridge 默认值都是 /app/downloads（原镜像同路径）。挂到别处会让
      # 分片写进容器临时层，radar LIVE_SEGMENTS_DIR 永远扫不到（复审 P0-1 修复）。
      - "${DOUYIN_STATE_DIR:-../../data/douyin}/live_segments:/app/downloads"
    restart: unless-stopped

  # Plan #5 直播弹幕采集：jwwsjlm/douyinLive v2.2.1（本地 a_bogus 签名，免浏览器）。
  # radar 通过 ws://127.0.0.1:1088/ws/<room_id> 订阅弹幕流（.env: DANMAKU_WS_BASE_URL），
  # 通过 /api/v1/rooms/{id}/status 查询房间状态。上游断线重连/未开播轮询由其内部处理。
  # 统一架构：弹幕引擎改由本仓库 engines/danmaku 构建（同 v2.2.1 源码）
  douyinlive:
    build: { context: ../../engines/danmaku, dockerfile: Dockerfile }
    image: radar-engine-danmaku
    container_name: douyinlive
    logging: *log_opts
    ports: ["127.0.0.1:${DOUYINLIVE_PORT:-1088}:1088"]
    mem_limit: 256m  # 实测 ~46MB
    restart: unless-stopped

  # 2026-11-10：YouTube PO Token 提供器（yt_dlp 适配器 fetch_pot=always 的依赖，
  # 见 adapters/yt_dlp.py _SABR_ARGS 注释）。上游只发布 :latest 标签，无版本化
  # tag 可 pin（pin 策略例外，digest 见下）；换镜像前先在隔离环境验证。
  # digest: sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-pot
    logging: *log_opts
    ports: ["127.0.0.1:4416:4416"]
    mem_limit: 512m
    restart: unless-stopped

volumes:
  dtk_pgdata:

networks:
  dtk-net:
