# RAD-100 生产形态（单机 compose 版；RAD-101 队列拆分为独立 worker 进程）。
# 前置：apps/web/dist 已构建（make build-web），.env 生产配置。
# 队列路由见 apps/api/app/worker/celery_app.py task_routes：
#   default → 普通编排任务；media → 发现/下载/直播分段；llm → 观点抽取（LLM token 成本隔离）。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: radar
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-radar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes: ["miniodata:/data"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD}@postgres:5432/radar
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-radar}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker-default:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.api }
    command: celery -A app.worker.celery_app worker -Q default --loglevel=info
    environment: &worker_env
      DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD}@postgres:5432/radar
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-radar}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  worker-media:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.api }
    command: celery -A app.worker.celery_app worker -Q media --concurrency=2 --loglevel=info
    environment: *worker_env
    volumes: ["models:/root/.cache/huggingface"]
    depends_on:
      redis: { condition: service_healthy }

  worker-llm:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.api }
    command: celery -A app.worker.celery_app worker -Q llm --concurrency=2 --loglevel=info
    environment:
      <<: *worker_env
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      redis: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  models:
